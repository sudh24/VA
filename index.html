<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine?</title>

<style>
  body {
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
    overflow: hidden;
    background-image: url('https://i.postimg.cc/VLc01bYW/IMG-8777.jpg');
    background-size: cover;
    background-position: center;
    transition: background 1s ease;
  }

  h1 {
    margin-bottom: 30px;
    text-align: center;
    font-size: 1.8rem;
    z-index: 2;
    color: white;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
  }

  .buttons {
    position: relative;
    width: 100%;
    height: 200px;
    max-width: 400px;
    z-index: 2;
  }

  button {
    font-size: 22px;
    padding: 16px 28px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.1s ease;
    touch-action: manipulation;
    z-index: 2;
    position: absolute;
  }

  #yesBtn {
    background-color: #ff4d6d;
    color: white;
    left: 20px;
    bottom: 20px;
  }

  #noBtn {
    background-color: #adb5bd;
    color: white;
  }

  .heart {
    position: fixed;
    bottom: -20px;
    font-size: 24px;
    animation: floatUp 4s linear forwards;
    pointer-events: none;
    z-index: 3;
  }

  @keyframes floatUp {
    to { transform: translateY(-110vh); opacity: 0; }
  }

  .confetti {
    position: fixed;
    width: 8px;
    height: 14px;
    animation: fall 3s linear forwards;
    pointer-events: none;
    z-index: 3;
  }

  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  .sparkle {
    position: fixed;
    pointer-events: none;
    font-size: 16px;
    z-index: 4;
    opacity: 1;
    animation: sparkleUp 1s linear forwards;
  }

  @keyframes sparkleUp {
    to { transform: translateY(-50px) scale(1.5); opacity: 0; }
  }
</style>
</head>
<body>

<h1 id="question">Will you be my Valentine? 💖</h1>

<div class="buttons">
  <button id="yesBtn">Yes</button>
  <button id="noBtn">No</button>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const buttonsDiv = document.querySelector(".buttons");
const question = document.getElementById("question");

const guiltTexts = [
  "Are you sure?", "You’ll regret this for 7 lifetimes 😩",
  "Come on… it’s just one click 😏", "You can’t resist forever…",
  "You know you secretly want to 😈", "You promised me a yes 😭",
  "I thought we were inseparable… 😢", "Think of the chocolate we could share 🍫",
  "Just imagine the hugs you’d get 🤗", "This is why I can’t trust easily 😭",
  "I thought we had something special 😭", "I believed in us… do you? 💔",
  "Wow. After EVERYTHING?", "Remember our 3am talks??", "That’s cold.",
  "This hurts 😭", 
];

let remainingGuiltTexts = [...guiltTexts]; // copy for no repeats
let yesSize = 22;
let isHoverDodge = false;
let dodgeRadiusX = 260;
let dodgeRadiusY = 180;

// Vibrate mobile if available
function vibratePhone() {
  if ("vibrate" in navigator) navigator.vibrate([50,30,50]);
}

// Get next guilt text without repeats
function getNextGuiltTextOnce() {
  if (remainingGuiltTexts.length === 0) {
    return "Fine… you win 😩";
  }
  const index = Math.floor(Math.random() * remainingGuiltTexts.length);
  const text = remainingGuiltTexts[index];
  remainingGuiltTexts.splice(index, 1);
  return text;
}

// No button moves randomly when clicked
noBtn.addEventListener("click", () => {
  vibratePhone();

  noBtn.textContent = getNextGuiltTextOnce();

  if (!isHoverDodge) {
    yesSize += 10;
    yesBtn.style.fontSize = yesSize + "px";
  }
  isHoverDodge = false;

  // Reduce dodge range after all guilt texts used
  if (remainingGuiltTexts.length === 0) {
    dodgeRadiusX *= 0.85; 
    dodgeRadiusY *= 0.85;
    noBtn.style.transform = `scale(${dodgeRadiusX / 260})`;
  }

  const questionRect = question.getBoundingClientRect();
  const yesRect = yesBtn.getBoundingClientRect();

  const centerX =
    (questionRect.left + questionRect.width / 2 +
     yesRect.left + yesRect.width / 2) / 2 - buttonsDiv.offsetLeft;

  const centerY =
    (questionRect.top + questionRect.height / 2 +
     yesRect.top + yesRect.height / 2) / 2 - buttonsDiv.offsetTop;

  const angle = Math.random() * 2 * Math.PI;

  let x = centerX + Math.cos(angle) * dodgeRadiusX - noBtn.offsetWidth / 2;
  let y = centerY + Math.sin(angle) * dodgeRadiusY - noBtn.offsetHeight / 2;

  x = Math.min(Math.max(x, 0), buttonsDiv.clientWidth - noBtn.offsetWidth);
  y = Math.min(Math.max(y, 0), buttonsDiv.clientHeight - noBtn.offsetHeight);

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
});

// Hover = dodge
noBtn.addEventListener("mouseenter", () => {
  isHoverDodge = true;
  noBtn.click();
});

// Yes button clicked
yesBtn.addEventListener("click", () => {
  document.body.style.backgroundImage =
    "url('https://i.postimg.cc/VLc01bYW/IMG-8777.jpg')";

  question.textContent = "YAY!!! 💕🥰 You’re my Valentine!";
  yesBtn.remove();
  noBtn.remove();

  const smallText = document.createElement("p");
  smallText.textContent = "Ich liebe dich ❤️";
  smallText.style.color = "white";
  smallText.style.fontSize = "1rem";
  smallText.style.marginTop = "8px";
  smallText.style.textAlign = "center";
  smallText.style.zIndex = "3";
  smallText.style.fontStyle = "italic";
  smallText.style.cursor = "pointer";
  smallText.title = "Click to see translation";
  smallText.style.transition = "transform 0.3s, color 0.3s";
  question.after(smallText);

  smallText.addEventListener("click", () => {
    smallText.textContent = smallText.textContent === "Ich liebe dich ❤️"
      ? "I love you ❤️"
      : "Ich liebe dich ❤️";
    createSparkle();
  });

  smallText.addEventListener("mouseenter", () => {
    smallText.style.transform = "scale(1.1)";
    smallText.style.color = "#ffd166";
  });
  smallText.addEventListener("mouseleave", () => {
    smallText.style.transform = "scale(1)";
    smallText.style.color = "white";
  });

  setInterval(createHeart, 250);
  for (let i = 0; i < 140; i++) setTimeout(createConfetti, i * 12);
});

// Create hearts
function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.textContent = "💖";
  heart.style.left = Math.random() * window.innerWidth + "px";
  heart.style.fontSize = (20 + Math.random() * 20) + "px";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 4000);
}

// Create confetti
function createConfetti() {
  const confetti = document.createElement("div");
  confetti.className = "confetti";
  confetti.style.left = Math.random() * window.innerWidth + "px";
  confetti.style.backgroundColor =
    ["#ff4d6d","#ffd166","#06d6a0","#4d96ff"][Math.floor(Math.random()*4)];
  document.body.appendChild(confetti);
  setTimeout(() => confetti.remove(), 3000);
}

// Sparkle effect
function createSparkle() {
  const sparkle = document.createElement("div");
  sparkle.className = "sparkle";
  sparkle.textContent = "✨";
  const rect = question.nextSibling.getBoundingClientRect();
  sparkle.style.left = rect.left + rect.width / 2 + "px";
  sparkle.style.top = rect.top + "px";
  document.body.appendChild(sparkle);
  setTimeout(() => sparkle.remove(), 1000);
}
</script>

</body>
</html>
